<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visca barca</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffe6f2;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Evitar que el confeti se corte */
            height: 100vh; /* Asegurar que el body ocupe toda la ventana */
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        img {
            width: 200px;
            height: 200px;
            margin-bottom: 20px;
        }
        .result-image {
            width: 250px; /* Tamaño de la imagen */
            height: 350px;
            margin-top: 20px;
        }
        
        .result-imag {
            width: 100px; /* Tamaño de la imagen */
            height: 100px;
            margin-top: 20px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }
        #yes {
            background-color: #ff66b2;
            color: white;
        }
        #no {
            background-color: #cccccc;
            color: black;
            position: absolute;
        }
         footer {
            margin-top: 50px;
            font-size: 5px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container" id="content-container">
        <img id="questionImage" src="" alt="">
        <h2 id="question">¿Lista para responder?</h2>
        <button id="yes" onclick="nextQuestion(true)">Sí</button>
        <button id="no" onclick="moveNoButton()">No</button>
    </div>

    <footer>
        <p>si lees esto me debes otro chillywilly. &copy;Rights Reserved alejojojo.</p>
    </footer>
    
    <script>
        const questions = [
            { text: "lista para responderr??", image: "imagen2.jpg" },
            { text: "¿Es Messi el mejor de la historia?", image: "imagen1.jpg" },
            { text: "ewww?", image: "imagen6.jpg" },
            { text: "you be my valentine?", image: "imagen5.jpg" }
        ];
        let currentQuestion = 0;
        updateQuestion();

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                updateQuestion();
            } else {
                // Cambiar el contenido cuando el usuario dice "Sí"
                document.querySelector('.container').innerHTML = `
                    <img class="result-imag" src="imagen7.jpg" alt="Imagen de corazón"> <!-- Cambia el nombre de la imagen aquí -->
                    <h2>es un si!! letsgooooo</h2>
                    <img class="result-image" src="imagen4.jpg" alt="Imagen de corazón"> <!-- Cambia el nombre de la imagen aquí -->
                `;
                // Iniciar el confeti cuando el usuario hace clic en el último "Sí"
                startConfetti();
            }
        }

        function updateQuestion() {
            document.getElementById("question").innerText = questions[currentQuestion].text;
            document.getElementById("questionImage").src = questions[currentQuestion].image;
        }

        function moveNoButton() {
            let button = document.getElementById("no");
            let x = Math.random() * (window.innerWidth - 100);
            let y = Math.random() * (window.innerHeight - 100);
            button.style.left = `${x}px`;
            button.style.top = `${y}px`;
        }

        // Función para generar el confeti en un bucle continuo con menos cantidad
        function startConfetti() {
            if (typeof confetti !== 'undefined') {
                // Crear un loop de confeti con menos partículas
                setInterval(function() {
                    confetti({
                        particleCount: 70, // Reducción del 30% de partículas
                        spread: 70,
                        origin: { x: Math.random(), y: 0 },
                        colors: ['#0000FF', '#00FF00', '#FFD700'], // Colores personalizados
                        gravity: 1,
                        drift: Math.random() * 2 - 1, // Desviación lateral aleatoria
                    });
                }, 100); // Generar confeti cada 100ms
            } else {
                console.error("La librería de confeti no está definida.");
            }
        }
    </script>
</body>
</html>

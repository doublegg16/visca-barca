<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>visca barca</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffe6f2;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        img {
            width: 200px;
            height: 200px;
            margin-bottom: 20px;
        }
        .result-image {
            width: 250px; /* Tamaño de la imagen */
            height: 350px;
            margin-top: 20px;
        }
        
        .result-imag {
            width: 100px; /* Tamaño de la imagen */
            height: 100px;
            margin-top: 20px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }
        #yes {
            background-color: #ff66b2;
            color: white;
        }
        #no {
            background-color: #cccccc;
            color: black;
            position: absolute;
        }
    </style>
</head>
<body>
    <div class="container" id="content-container">
        <img id="questionImage" src="" alt="">
        <h2 id="question">¿Lista para responder?</h2>
        <button id="yes" onclick="nextQuestion(true)">Sí</button>
        <button id="no" onclick="moveNoButton()">No</button>
    </div>
    
    <script>
        const questions = [
            { text: "lista para responderr??", image: "imagen2.jpg" },
            { text: "¿Es Messi el mejor de la historia?", image: "imagen1.jpg" },
            { text: "ewww?", image: "imagen6.jpg" },
            { text: "you be my valentine?", image: "imagen5.jpg" }
        ];
        let currentQuestion = 0;
        updateQuestion();

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                updateQuestion();
            } else {
                // Aquí cambiamos el contenido cuando el usuario dice "Sí"
                document.querySelector('.container').innerHTML = `
                    <img class="result-imag" src="imagen7.jpg" alt="Imagen de corazón"> <!-- Cambia el nombre de la imagen aquí -->
                    <h2>sabia que ibas a decir que si!</h2>
                    <img class="result-image" src="imagen4.jpg" alt="Imagen de corazón"> <!-- Cambia el nombre de la imagen aquí -->
                `;
            }
        }

        function updateQuestion() {
            document.getElementById("question").innerText = questions[currentQuestion].text;
            document.getElementById("questionImage").src = questions[currentQuestion].image;
        }

        function moveNoButton() {
            let button = document.getElementById("no");
            let x = Math.random() * (window.innerWidth - 100);
            let y = Math.random() * (window.innerHeight - 100);
            button.style.left = `${x}px`;
            button.style.top = `${y}px`;
        }
    </script>
</body>
</html>
